<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="brassBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b8860b;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#daa520;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#daa520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brassHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fff8dc;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#ffd700;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#fff8dc;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="coffee" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0f05;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#2d1810;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#3d2418;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a2c1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="froth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e6c8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ede0b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6d4a0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="milk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf6e3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5e6c8;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="brassShine" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#fff8dc;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Tumbler (lower cup) -->
  <g transform="translate(150, 380)">
    <!-- Tumbler body -->
    <path d="M-55,0 L-55,-180 L-45,-190 L45,-190 L45,-180 L55,-180 L55,0 Z" fill="url(#brassBody)" stroke="#9a7008" stroke-width="1.5"/>
    <path d="M-50,0 L-50,-175 L-45,-185 L45,-185 L50,-175 L50,0 Z" fill="url(#brassHighlight)"/>
    
    <!-- Coffee in tumbler -->
    <path d="M-48,0 L-48,-140 L-43,-150 L43,-150 L48,-140 L48,0 Z" fill="url(#coffee)"/>
    
    <!-- Tumbler rim highlight -->
    <ellipse cx="0" cy="-190" rx="50" ry="4" fill="url(#brassHighlight)"/>
    <ellipse cx="0" cy="-190" rx="48" ry="3" fill="#ffd700" opacity="0.3"/>
    
    <!-- Tumbler base ring -->
    <ellipse cx="0" cy="0" rx="55" ry="6" fill="url(#brassBody)"/>
    <ellipse cx="0" cy="2" rx="53" ry="4" fill="url(#brassHighlight)"/>
    
    <!-- Decorative rings on tumbler -->
    <g stroke="#9a7008" stroke-width="1" fill="none" opacity="0.5">
      <ellipse cx="0" cy="-60" rx="50" ry="3"/>
      <ellipse cx="0" cy="-120" rx="48" ry="3"/>
    </g>
  </g>
  
  <!-- Davarah (upper saucer-cup) -->
  <g transform="translate(150, 180)">
    <!-- Davarah saucer base -->
    <ellipse cx="0" cy="20" rx="85" ry="8" fill="url(#brassBody)"/>
    <ellipse cx="0" cy="22" rx="82" ry="6" fill="url(#brassHighlight)"/>
    <ellipse cx="0" cy="20" rx="70" ry="6" fill="#b8860b" opacity="0.3"/>
    
    <!-- Davarah cup -->
    <path d="M-45,20 L-45,-80 L-35,-90 L35,-90 L45,-80 L45,20 Z" fill="url(#brassBody)" stroke="#9a7008" stroke-width="1.5"/>
    <path d="M-40,20 L-40,-75 L-35,-85 L35,-85 L40,-75 L40,20 Z" fill="url(#brassHighlight)"/>
    
    <!-- Coffee in davarah -->
    <path d="M-38,20 L-38,-40 L-33,-50 L33,-50 L38,-40 L38,20 Z" fill="url(#coffee)"/>
    
    <!-- Froth on top -->
    <ellipse cx="0" cy="-65" rx="35" ry="12" fill="url(#froth)"/>
    <ellipse cx="0" cy="-68" rx="30" ry="8" fill="#fdf6e3" opacity="0.9"/>
    
    <!-- Froth texture bubbles -->
    <g fill="#fff8dc" opacity="0.7">
      <circle cx="-20" cy="-70" r="4"/>
      <circle cx="20" cy="-72" r="3"/>
      <circle cx="0" cy="-60" r="3"/>
      <circle cx="15" cy="-65" r="2"/>
      <circle cx="-15" cy="-68" r="2"/>
      <circle cx="8" cy="-75" r="2"/>
    </g>
    
    <!-- Davarah rim -->
    <ellipse cx="0" cy="-90" rx="40" ry="4" fill="url(#brassHighlight)"/>
    <ellipse cx="0" cy="-90" rx="38" ry="3" fill="#ffd700" opacity="0.3"/>
  </g>
  
  <!-- Pouring stream (from davarah to tumbler) -->
  <g transform="translate(150, 100)" opacity="0.9">
    <!-- Coffee stream -->
    <path d="M0,0 Q5,-40 2,-80 Q-1,-120 -3,-160 Q0,-180 0,-200" 
          stroke="url(#coffee)" stroke-width="6" fill="none" 
          stroke-linecap="round"/>
    <path d="M0,0 Q3,-35 1,-70 Q-2,-110 -4,-150 Q1,-175 0,-195" 
          stroke="#3d2418" stroke-width="3" fill="none" 
          stroke-linecap="round" opacity="0.7"/>
    
    <!-- Steam wisps -->
    <g stroke="#e6d4a0" stroke-width="1.5" fill="none" opacity="0.5">
      <path d="M-15,-20 Q-25,-50 -20,-90" stroke-dasharray="5,5"/>
      <path d="M15,-20 Q25,-50 20,-90" stroke-dasharray="5,5"/>
      <path d="M-25,-40 Q-35,-80 -30,-120" stroke-dasharray="5,5"/>
      <path d="M25,-40 Q35,-80 30,-120" stroke-dasharray="5,5"/>
    </g>
  </g>
  
  <!-- Brass shine reflections -->
  <g transform="translate(150, 380)">
    <ellipse cx="-20" cy="-100" rx="15" ry="40" fill="url(#brassShine)" opacity="0.3"/>
    <ellipse cx="20" cy="-100" rx="15" ry="40" fill="url(#brassShine)" opacity="0.2"/>
  </g>
  
  <g transform="translate(150, 180)">
    <ellipse cx="-15" cy="-40" rx="12" ry="30" fill="url(#brassShine)" opacity="0.3"/>
    <ellipse cx="15" cy="-40" rx="12" ry="30" fill="url(#brassShine)" opacity="0.2"/>
  </g>
  
  <!-- Chicory granules hint (small dots in coffee) -->
  <g transform="translate(150, 380)" fill="#1a0f05" opacity="0.4">
    <circle cx="-25" cy="-80" r="1"/>
    <circle cx="20" cy="-100" r="1"/>
    <circle cx="-10" cy="-120" r="1"/>
    <circle cx="30" cy="-60" r="1"/>
  </g>
</svg>