<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="vadaGolden" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4c842;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#e8b830;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#d4a01e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vadaCrust" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c8962e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a67c1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b6914;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vadaInterior" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e0a0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e8d088;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dcc870;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="oilShine" cx="40%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#fff8dc;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#e8b830;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="chutneyGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chutneyRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f87171;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Vada 1 (front left) -->
  <g transform="translate(100, 180)">
    <!-- Vada base shadow -->
    <ellipse cx="0" cy="35" rx="65" ry="8" fill="#1a1a1a" opacity="0.15"/>
    
    <!-- Vada body -->
    <ellipse cx="0" cy="0" rx="70" ry="30" fill="url(#vadaGolden)"/>
    
    <!-- Vada top surface with texture -->
    <ellipse cx="0" cy="-12" rx="62" ry="22" fill="url(#vadaCrust)"/>
    
    <!-- Central hole -->
    <ellipse cx="0" cy="-10" rx="18" ry="10" fill="#1a1a1a" opacity="0.9"/>
    <ellipse cx="0" cy="-8" rx="14" ry="7" fill="#2d1810" opacity="0.5"/>
    
    <!-- Crust texture lines -->
    <g stroke="#a67c1a" stroke-width="1" fill="none" opacity="0.4">
      <ellipse cx="0" cy="-8" rx="50" ry="16"/>
      <ellipse cx="0" cy="-4" rx="42" ry="13"/>
      <ellipse cx="0" cy="0" rx="35" ry="10"/>
    </g>
    
    <!-- Oil bubbles/craters on surface -->
    <g fill="#b8860b" opacity="0.6">
      <ellipse cx="-25" cy="-15" rx="4" ry="2"/>
      <ellipse cx="20" cy="-18" rx="3" ry="1.5"/>
      <ellipse cx="30" cy="-5" rx="3.5" ry="1.5"/>
      <ellipse cx="-30" cy="-8" rx="2.5" ry="1"/>
      <ellipse cx="10" cy="5" rx="3" ry="1.5"/>
      <ellipse cx="-20" cy="8" rx="3" ry="1.5"/>
    </g>
    
    <!-- Oil shine highlight -->
    <ellipse cx="-15" cy="-20" rx="20" ry="8" fill="url(#oilShine)"/>
  </g>
  
  <!-- Vada 2 (front right, slightly behind) -->
  <g transform="translate(260, 190)">
    <ellipse cx="0" cy="35" rx="65" ry="8" fill="#1a1a1a" opacity="0.12"/>
    <ellipse cx="0" cy="0" rx="70" ry="30" fill="url(#vadaGolden)"/>
    <ellipse cx="0" cy="-12" rx="62" ry="22" fill="url(#vadaCrust)"/>
    <ellipse cx="0" cy="-10" rx="18" ry="10" fill="#1a1a1a" opacity="0.9"/>
    <ellipse cx="0" cy="-8" rx="14" ry="7" fill="#2d1810" opacity="0.5"/>
    <g stroke="#a67c1a" stroke-width="1" fill="none" opacity="0.3">
      <ellipse cx="0" cy="-8" rx="50" ry="16"/>
      <ellipse cx="0" cy="-4" rx="42" ry="13"/>
    </g>
    <g fill="#b8860b" opacity="0.5">
      <ellipse cx="-20" cy="-12" rx="3.5" ry="1.5"/>
      <ellipse cx="18" cy="-15" rx="2.5" ry="1"/>
      <ellipse cx="-30" cy="-5" rx="3" ry="1"/>
      <ellipse cx="25" cy="5" rx="2.5" ry="1"/>
    </g>
    <ellipse cx="10" cy="-18" rx="15" ry="6" fill="url(#oilShine)"/>
  </g>
  
  <!-- Vada 3 (back center, stacked) -->
  <g transform="translate(180, 110)">
    <ellipse cx="0" cy="30" rx="55" ry="7" fill="#1a1a1a" opacity="0.1"/>
    <ellipse cx="0" cy="-5" rx="60" ry="25" fill="url(#vadaGolden)"/>
    <ellipse cx="0" cy="-15" rx="52" ry="18" fill="url(#vadaCrust)"/>
    <ellipse cx="0" cy="-13" rx="16" ry="9" fill="#1a1a1a" opacity="0.9"/>
    <ellipse cx="0" cy="-11" rx="12" ry="6" fill="#2d1810" opacity="0.5"/>
    <g fill="#b8860b" opacity="0.4">
      <ellipse cx="-15" cy="-18" rx="3" ry="1.5"/>
      <ellipse cx="15" cy="-20" rx="2.5" ry="1"/>
    </g>
  </g>
  
  <!-- Coconut Chutney Bowl (left) -->
  <g transform="translate(50, 260)">
    <ellipse cx="0" cy="18" rx="55" ry="18" fill="#fefefe" stroke="#e8dfd3" stroke-width="1.5"/>
    <ellipse cx="0" cy="10" rx="50" ry="14" fill="url(#chutneyGreen)"/>
    <ellipse cx="0" cy="5" rx="45" ry="11" fill="#5ee78a" opacity="0.8"/>
    
    <!-- Chutney texture: coconut bits -->
    <g fill="#ffffff" opacity="0.7">
      <circle cx="-15" cy="0" r="2.5"/>
      <circle cx="12" cy="-3" r="2"/>
      <circle cx="-8" cy="6" r="2"/>
      <circle cx="20" cy="4" r="2"/>
      <circle cx="0" cy="-5" r="2.5"/>
    </g>
    
    <!-- Green chili bits -->
    <g fill="#166534">
      <ellipse cx="-20" cy="-5" rx="2" ry="5" transform="rotate(-30 -20 -5)"/>
      <ellipse cx="18" cy="2" rx="2" ry="4" transform="rotate(20 18 2)"/>
    </g>
    
    <!-- Curry leaves on top -->
    <g fill="#15803d" opacity="0.9">
      <ellipse cx="-25" cy="-8" rx="2" ry="8" transform="rotate(-45 -25 -8)"/>
      <ellipse cx="22" cy="-10" rx="2" ry="7" transform="rotate(30 22 -10)"/>
    </g>
    
    <!-- Bowl rim -->
    <ellipse cx="0" cy="-18" rx="55" ry="6" fill="#fefefe" stroke="#e8dfd3" stroke-width="1.5"/>
    <ellipse cx="0" cy="-18" rx="53" ry="4" fill="#fafafa" opacity="0.5"/>
  </g>
  
  <!-- Tomato Chutney Bowl (right) -->
  <g transform="translate(350, 260)">
    <ellipse cx="0" cy="18" rx="55" ry="18" fill="#fefefe" stroke="#e8dfd3" stroke-width="1.5"/>
    <ellipse cx="0" cy="10" rx="50" ry="14" fill="url(#chutneyRed)"/>
    <ellipse cx="0" cy="5" rx="45" ry="11" fill="#fca5a5" opacity="0.8"/>
    
    <!-- Chutney texture: tomato bits -->
    <g fill="#dc2626" opacity="0.7">
      <circle cx="-12" cy="0" r="3"/>
      <circle cx="15" cy="-2" r="2.5"/>
      <circle cx="-8" cy="5" r="2.5"/>
      <circle cx="22" cy="3" r="2"/>
    </g>
    
    <!-- Red chili bits -->
    <g fill="#991b1b">
      <ellipse cx="-18" cy="-4" rx="2" ry="5" transform="rotate(-20 -18 -4)"/>
      <ellipse cx="16" cy="1" rx="2" ry="4" transform="rotate(15 16 1)"/>
    </g>
    
    <!-- Curry leaves -->
    <g fill="#15803d" opacity="0.9">
      <ellipse cx="-22" cy="-6" rx="2" ry="7" transform="rotate(-40 -22 -6)"/>
      <ellipse cx="20" cy="-8" rx="2" ry="7" transform="rotate(35 20 -8)"/>
    </g>
    
    <!-- Bowl rim -->
    <ellipse cx="0" cy="-18" rx="55" ry="6" fill="#fefefe" stroke="#e8dfd3" stroke-width="1.5"/>
    <ellipse cx="0" cy="-18" rx="53" ry="4" fill="#fafafa" opacity="0.5"/>
  </g>
  
  <!-- Oil droplets on surface -->
  <g fill="#e8b830" opacity="0.3">
    <ellipse cx="80" cy="200" rx="8" ry="3"/>
    <ellipse cx="320" cy="210" rx="6" ry="2.5"/>
    <ellipse cx="150" cy="140" rx="5" ry="2"/>
  </g>
  
  <!-- Steam wisps -->
  <g stroke="#f5e6c8" stroke-width="1.5" fill="none" opacity="0.3">
    <path d="M100,110 Q110,80 105,50" stroke-dasharray="4,4"/>
    <path d="M260,120 Q270,90 265,60" stroke-dasharray="4,4"/>
    <path d="M180,50 Q190,20 185,-10" stroke-dasharray="4,4"/>
  </g>
</svg>