<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bananaLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5a27;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3a7d32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e4d1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rice" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fffef7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f0e8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sambar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c05621;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b3d1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rasam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e87a4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c05621;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="payasam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf6e3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5e6c8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ghee" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff8d6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0e68c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Banana leaf base -->
  <path d="M20,50 Q200,20 380,50 Q390,150 380,250 Q200,280 20,250 Q10,150 20,50" fill="url(#bananaLeaf)" stroke="#1a3d16" stroke-width="2"/>
  
  <!-- Leaf central vein -->
  <path d="M200,40 Q200,50 200,260" stroke="#2d5a27" stroke-width="1.5" fill="none" opacity="0.6"/>
  
  <!-- Side veins -->
  <g stroke="#2d5a27" stroke-width="0.8" fill="none" opacity="0.4">
    <path d="M200,60 Q120,80 40,120"/>
    <path d="M200,60 Q280,80 360,120"/>
    <path d="M200,100 Q110,130 40,180"/>
    <path d="M200,100 Q290,130 360,180"/>
    <path d="M200,150 Q100,180 40,240"/>
    <path d="M200,150 Q300,180 360,240"/>
  </g>
  
  <!-- Rice mound (center) -->
  <ellipse cx="200" cy="150" rx="85" ry="35" fill="url(#rice)" stroke="#e8dfd3" stroke-width="1"/>
  <ellipse cx="200" cy="145" rx="70" ry="25" fill="#fffef7" opacity="0.8"/>
  
  <!-- Ghee dollop on rice -->
  <ellipse cx="175" cy="135" rx="12" ry="8" fill="url(#ghee)" opacity="0.9"/>
  <ellipse cx="175" cy="133" rx="8" ry="5" fill="#fffde7" opacity="0.8"/>
  
  <!-- Sambar bowl (left) -->
  <g transform="translate(65,140)">
    <ellipse cx="0" cy="15" rx="45" ry="18" fill="url(#sambar)"/>
    <ellipse cx="0" cy="5" rx="40" ry="12" fill="#c05621" opacity="0.9"/>
    <!-- Drumstick pieces -->
    <rect x="-25" y="-5" width="8" height="25" rx="2" fill="#8b6914"/>
    <rect x="-15" y="-8" width="8" height="28" rx="2" fill="#8b6914" transform="rotate(-15 -11 6)"/>
    <rect x="5" y="-6" width="8" height="26" rx="2" fill="#8b6914" transform="rotate(10 9 6)"/>
  </g>
  
  <!-- Rasam bowl (right) -->
  <g transform="translate(335,140)">
    <ellipse cx="0" cy="15" rx="45" ry="18" fill="url(#rasam)"/>
    <ellipse cx="0" cy="5" rx="40" ry="12" fill="#e87a4a" opacity="0.9"/>
    <!-- Tomato pieces -->
    <circle cx="-10" cy="0" r="5" fill="#c0392b"/>
    <circle cx="10" cy="0" r="5" fill="#c0392b"/>
    <circle cx="0" cy="-8" r="5" fill="#c0392b"/>
  </g>
  
  <!-- Poriyal (upper left) -->
  <g transform="translate(60,70)">
    <ellipse cx="0" cy="0" rx="35" ry="15" fill="#3a7d32" opacity="0.8"/>
    <ellipse cx="-8" cy="-3" r="5" fill="#4ade80" opacity="0.7"/>
    <circle cx="8" cy="-2" r="5" fill="#4ade80" opacity="0.7"/>
    <circle cx="0" cy="6" r="5" fill="#4ade80" opacity="0.7"/>
  </g>
  
  <!-- Kootu (upper right) -->
  <g transform="translate(340,70)">
    <ellipse cx="0" cy="0" rx="35" ry="15" fill="#8fbc8f" opacity="0.8"/>
    <circle cx="-10" cy="-3" r="4" fill="#f0e68c"/>
    <circle cx="10" cy="-3" r="4" fill="#f0e68c"/>
    <circle cx="0" cy="5" r="4" fill="#f0e68c"/>
  </g>
  
  <!-- Appalam (bottom left) -->
  <g transform="translate(50,250)">
    <ellipse cx="0" cy="0" rx="40" ry="4" fill="#d4a574"/>
    <ellipse cx="0" cy="-1" rx="35" ry="3" fill="#e8c498"/>
  </g>
  
  <!-- Payasam bowl (bottom right) -->
  <g transform="translate(350,250)">
    <ellipse cx="0" cy="10" rx="35" ry="15" fill="url(#payasam)"/>
    <ellipse cx="0" cy="2" rx="30" ry="10" fill="#fdf6e3" opacity="0.9"/>
    <!-- Cashews and raisins -->
    <ellipse cx="-10" cy="-5" rx="3" ry="5" fill="#8b6914"/>
    <ellipse cx="10" cy="-5" rx="3" ry="5" fill="#8b6914"/>
    <circle cx="0" cy="0" r="3" fill="#4a2c1a"/>
    <circle cx="-5" cy="5" r="3" fill="#4a2c1a"/>
  </g>
  
  <!-- Curd (center bottom) -->
  <g transform="translate(200,240)">
    <ellipse cx="0" cy="8" rx="35" ry="12" fill="#fffef7"/>
    <ellipse cx="0" cy="2" rx="30" ry="8" fill="#fefefe" opacity="0.9"/>
  </g>
  
  <!-- Salt/garnish sprinkles -->
  <g fill="#fffef7" opacity="0.6">
    <circle cx="180" cy="120" r="1.5"/>
    <circle cx="220" cy="118" r="1.5"/>
    <circle cx="185" cy="165" r="1.5"/>
    <circle cx="215" cy="162" r="1.5"/>
  </g>
</svg>