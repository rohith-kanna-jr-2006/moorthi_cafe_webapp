<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="idliWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fafafa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="idliShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e8e8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="podiRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e85d2a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c8461e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a03815;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="podiDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b3a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5c2410;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sesameOil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0e68c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4c470;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="thattePlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8dfd3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#dec0b5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4c4b0;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="idliHighlight" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Thatte (plate) base -->
  <ellipse cx="200" cy="260" rx="180" ry="18" fill="url(#thattePlate)" stroke="#c8b8a8" stroke-width="2"/>
  <ellipse cx="200" cy="258" rx="175" ry="14" fill="#e8dfd3" opacity="0.5"/>
  <ellipse cx="200" cy="244" rx="165" ry="6" fill="#d4c4b0" opacity="0.3"/>
  
  <!-- Idli 1 (front left) -->
  <g transform="translate(80, 180)">
    <!-- Idli shadow on plate -->
    <ellipse cx="0" cy="48" rx="55" ry="6" fill="#1a1a1a" opacity="0.1"/>
    
    <!-- Idli body - soft dome -->
    <path d="M-55,0 Q-55,-25 -50,-45 Q0,-65 50,-45 Q55,-25 55,0 Z" fill="url(#idliWhite)" stroke="#e0e0e0" stroke-width="0.5"/>
    
    <!-- Idli highlight -->
    <ellipse cx="-10" cy="-20" rx="25" ry="18" fill="url(#idliHighlight)" opacity="0.6"/>
    
    <!-- Podi coating on top -->
    <path d="M-50,-45 Q-50,-50 -45,-58 Q0,-72 45,-58 Q50,-50 50,-45 Z" fill="url(#podiRed)"/>
    <path d="M-45,-50 Q-45,-53 -42,-58 Q0,-68 42,-58 Q45,-53 45,-50 Z" fill="url(#podiDark)" opacity="0.7"/>
    
    <!-- Podi texture granules -->
    <g fill="#a03815" opacity="0.8">
      <circle cx="-30" cy="-55" r="1.5"/>
      <circle cx="-15" cy="-60" r="1.2"/>
      <circle cx="0" cy="-62" r="1.5"/>
      <circle cx="15" cy="-60" r="1.2"/>
      <circle cx="30" cy="-55" r="1.5"/>
      <circle cx="-20" cy="-58" r="1"/>
      <circle cx="10" cy="-63" r="1"/>
      <circle cx="25" cy="-57" r="1.2"/>
      <circle cx="-5" cy="-57" r="1.3"/>
    </g>
    
    <!-- Sesame oil drizzle -->
    <g fill="url(#sesameOil)" opacity="0.7">
      <ellipse cx="-25" cy="-52" rx="8" ry="2" transform="rotate(-20 -25 -52)"/>
      <ellipse cx="20" cy="-55" rx="6" ry="1.5" transform="rotate(15 20 -55)"/>
      <ellipse cx="0" cy="-58" rx="5" ry="1.5" transform="rotate(-10 0 -58)"/>
    </g>
    
    <!-- Oil pool at base -->
    <ellipse cx="0" cy="5" rx="30" ry="3" fill="#f0e68c" opacity="0.3"/>
  </g>
  
  <!-- Idli 2 (front right) -->
  <g transform="translate(260, 180)">
    <ellipse cx="0" cy="48" rx="55" ry="6" fill="#1a1a1a" opacity="0.1"/>
    <path d="M-55,0 Q-55,-25 -50,-45 Q0,-65 50,-45 Q55,-25 55,0 Z" fill="url(#idliWhite)" stroke="#e0e0e0" stroke-width="0.5"/>
    <ellipse cx="-10" cy="-20" rx="25" ry="18" fill="url(#idliHighlight)" opacity="0.5"/>
    <path d="M-50,-45 Q-50,-50 -45,-58 Q0,-72 45,-58 Q50,-50 50,-45 Z" fill="url(#podiRed)"/>
    <path d="M-45,-50 Q-45,-53 -42,-58 Q0,-68 42,-58 Q45,-53 45,-50 Z" fill="url(#podiDark)" opacity="0.7"/>
    <g fill="#a03815" opacity="0.7">
      <circle cx="-25" cy="-55" r="1.5"/>
      <circle cx="-10" cy="-60" r="1.2"/>
      <circle cx="12" cy="-62" r="1.5"/>
      <circle cx="28" cy="-56" r="1.2"/>
      <circle cx="5" cy="-58" r="1"/>
    </g>
    <g fill="url(#sesameOil)" opacity="0.6">
      <ellipse cx="-18" cy="-52" rx="6" ry="1.5" transform="rotate(-15 -18 -52)"/>
      <ellipse cx="18" cy="-55" rx="5" ry="1.5" transform="rotate(20 18 -55)"/>
    </g>
    <ellipse cx="0" cy="5" rx="30" ry="3" fill="#f0e68c" opacity="0.25"/>
  </g>
  
  <!-- Idli 3 (back center) -->
  <g transform="translate(180, 110)">
    <ellipse cx="0" cy="42" rx="50" ry="5" fill="#1a1a1a" opacity="0.08"/>
    <path d="M-50,0 Q-50,-22 -45,-40 Q0,-58 45,-40 Q50,-22 50,0 Z" fill="url(#idliWhite)" stroke="#e0e0e0" stroke-width="0.5"/>
    <ellipse cx="-8" cy="-18" rx="22" ry="15" fill="url(#idliHighlight)" opacity="0.4"/>
    <path d="M-45,-40 Q-45,-45 -40,-52 Q0,-65 40,-52 Q45,-45 45,-40 Z" fill="url(#podiRed)"/>
    <path d="M-40,-45 Q-40,-48 -37,-52 Q0,-62 37,-52 Q40,-48 40,-45 Z" fill="url(#podiDark)" opacity="0.6"/>
    <g fill="#a03815" opacity="0.6">
      <circle cx="-20" cy="-48" r="1.3"/>
      <circle cx="15" cy="-52" r="1.3"/>
      <circle cx="0" cy="-55" r="1.5"/>
    </g>
    <g fill="url(#sesameOil)" opacity="0.5">
      <ellipse cx="-12" cy="-48" rx="5" ry="1.5" transform="rotate(-10 -12 -48)"/>
    </g>
  </g>
  
  <!-- Idli 4 (left back) -->
  <g transform="translate(40, 110)">
    <ellipse cx="0" cy="42" rx="45" ry="5" fill="#1a1a1a" opacity="0.06"/>
    <path d="M-45,0 Q-45,-20 -40,-38 Q0,-55 40,-38 Q45,-20 45,0 Z" fill="url(#idliWhite)" stroke="#e0e0e0" stroke-width="0.5"/>
    <path d="M-40,-38 Q-40,-43 -35,-48 Q0,-60 35,-48 Q40,-43 40,-38 Z" fill="url(#podiRed)"/>
    <g fill="#a03815" opacity="0.5">
      <circle cx="-15" cy="-42" r="1.2"/>
      <circle cx="10" cy="-46" r="1.2"/>
    </g>
  </g>
  
  <!-- Idli 5 (right back) -->
  <g transform="translate(340, 110)">
    <ellipse cx="0" cy="42" rx="45" ry="5" fill="#1a1a1a" opacity="0.06"/>
    <path d="M-45,0 Q-45,-20 -40,-38 Q0,-55 40,-38 Q45,-20 45,0 Z" fill="url(#idliWhite)" stroke="#e0e0e0" stroke-width="0.5"/>
    <path d="M-40,-38 Q-40,-43 -35,-48 Q0,-60 35,-48 Q40,-43 40,-38 Z" fill="url(#podiRed)"/>
    <g fill="#a03815" opacity="0.5">
      <circle cx="-12" cy="-42" r="1.2"/>
      <circle cx="12" cy="-46" r="1.2"/>
    </g>
  </g>
  
  <!-- Podi powder bowl (left side) -->
  <g transform="translate(50, 250)">
    <ellipse cx="0" cy="16" rx="50" ry="16" fill="#fefefe" stroke="#dec0b5" stroke-width="1.5"/>
    <ellipse cx="0" cy="8" rx="45" ry="12" fill="url(#podiRed)"/>
    <ellipse cx="0" cy="4" rx="40" ry="9" fill="#c8461e" opacity="0.8"/>
    
    <!-- Podi texture in bowl -->
    <g fill="#a03815" opacity="0.7">
      <circle cx="-15" cy="0" r="1.5"/>
      <circle cx="12" cy="-2" r="1.3"/>
      <circle cx="-8" cy="4" r="1.4"/>
      <circle cx="20" cy="2" r="1.2"/>
      <circle cx="0" cy="-3" r="1.5"/>
      <circle cx="-22" cy="3" r="1"/>
      <circle cx="25" cy="1" r="1.2"/>
    </g>
    
    <!-- Bowl rim -->
    <ellipse cx="0" cy="-16" rx="50" ry="5" fill="#fefefe" stroke="#dec0b5" stroke-width="1.5"/>
    <ellipse cx="0" cy="-16" rx="48" ry="3" fill="#fafafa" opacity="0.4"/>
  </g>
  
  <!-- Sesame oil bowl (right side) -->
  <g transform="translate(350, 250)">
    <ellipse cx="0" cy="16" rx="50" ry="16" fill="#fefefe" stroke="#dec0b5" stroke-width="1.5"/>
    <ellipse cx="0" cy="8" rx="45" ry="12" fill="url(#sesameOil)"/>
    <ellipse cx="0" cy="4" rx="40" ry="9" fill="#e6d4a0" opacity="0.8"/>
    
    <!-- Oil shimmer -->
    <g fill="#fff8dc" opacity="0.5">
      <ellipse cx="-15" cy="2" rx="10" ry="3"/>
      <ellipse cx="12" cy="-2" rx="8" ry="2.5"/>
    </g>
    <g fill="#f0e68c" opacity="0.6">
      <ellipse cx="-10" cy="0" rx="5" ry="2"/>
      <ellipse cx="18" cy="-1" rx="4" ry="1.5"/>
    </g>
    
    <!-- Bowl rim -->
    <ellipse cx="0" cy="-16" rx="50" ry="5" fill="#fefefe" stroke="#dec0b5" stroke-width="1.5"/>
    <ellipse cx="0" cy="-16" rx="48" ry="3" fill="#fafafa" opacity="0.4"/>
  </g>
  
  <!-- Curry leaves garnish on idlis -->
  <g fill="#15803d" opacity="0.9">
    <g transform="translate(80, 130)">
      <ellipse cx="-10" cy="0" rx="2" ry="10" transform="rotate(-30 -10 0)"/>
      <ellipse cx="15" cy="-5" rx="2" ry="8" transform="rotate(25 15 -5)"/>
    </g>
    <g transform="translate(260, 130)">
      <ellipse cx="-8" cy="2" rx="2" ry="9" transform="rotate(-20 -8 2)"/>
      <ellipse cx="18" cy="-3" rx="2" ry="8" transform="rotate(30 18 -3)"/>
    </g>
    <g transform="translate(180, 70)">
      <ellipse cx="0" cy="-2" rx="2" ry="8" transform="rotate(-15 0 -2)"/>
    </g>
  </g>
  
  <!-- Steam wisps -->
  <g stroke="#f5f0e0" stroke-width="1.5" fill="none" opacity="0.25">
    <path d="M80,110 Q90,80 85,50" stroke-dasharray="4,4"/>
    <path d="M260,110 Q270,80 265,50" stroke-dasharray="4,4"/>
    <path d="M180,50 Q190,20 185,-10" stroke-dasharray="4,4"/>
    <path d="M40,50 Q50,20 45,-10" stroke-dasharray="4,4"/>
    <path d="M340,50 Q350,20 345,-10" stroke-dasharray="4,4"/>
  </g>
  
  <!-- Mustard seeds and urad dal tempering on podi -->
  <g transform="translate(50, 230)" fill="#1a1a1a" opacity="0.7">
    <circle cx="-18" cy="0" r="1"/>
    <circle cx="15" cy="-2" r="1"/>
    <circle cx="-5" cy="3" r="1"/>
    <circle cx="22" cy="1" r="1"/>
  </g>
  
  <g transform="translate(50, 230)" fill="#8b6914" opacity="0.7">
    <ellipse cx="-10" cy="0" rx="1.5" ry="3" transform="rotate(-10 -10 0)"/>
    <ellipse cx="12" cy="-1" rx="1.5" ry="3" transform="rotate(15 12 -1)"/>
    <ellipse cx="20" cy="2" rx="1.5" ry="3" transform="rotate(-5 20 2)"/>
  </g>
</svg>